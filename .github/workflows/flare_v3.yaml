on:
  workflow_dispatch:
  schedule:
  - cron: "0 12 * * *"

jobs:
  build:
    runs-on: ubuntu-latest #self-hosted
    container:
      image: rqthomas/flare-rocker:4.4
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

# Point to the right path, run the right Rscript command
      - name: Run automatic prediction file
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          EDI_ACCESS_KEY: ${{ secrets.EDI_ACCESS_KEY }}
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        run:  Rscript $GITHUB_WORKSPACE/workflows/glm_flare_v3/combined_workflow.R

      - name: Call Healthcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y curl
          curl -m 10 --retry 5 https://hc-ping.com/9af38db8-d058-4e2c-9779-cd69891d9216
